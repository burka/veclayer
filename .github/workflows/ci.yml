# Ref: #52
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.93)
        uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@veclayer.test"
          git config --global user.name "CI Runner"

      - name: Install protoc (needed by lance-encoding via prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: cargo nextest run --all-features

      - name: Check library-only surface (no cli, sqlite only)
        # Verifies that a sqlite-only library consumer compiles correctly without
        # the cli feature tree pulling in lancedb, mcp, config, and parser.
        run: cargo check --no-default-features --features store-sqlite

  ci-macos:
    name: CI (macOS smoke)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.93)
        uses: dtolnay/rust-toolchain@1.93

      - name: Configure git identity
        run: |
          git config --global user.email "ci@veclayer.test"
          git config --global user.name "CI Runner"

      - name: Install protoc (needed by lance-encoding via prost-build)
        run: brew install protobuf

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Run tests (default features)
        run: cargo test

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  feature-check:
    name: Feature combinations
    runs-on: ubuntu-latest

    strategy:
      matrix:
        features:
          - ""
          - "--no-default-features --features store-sqlite"
          - "--no-default-features --features store-lance"
          - "--no-default-features --features server"
          - "--no-default-features --features cli,store-sqlite,embedding-local,clustering"
          - "--all-features"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.93)
        uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy

      - name: Configure git identity
        run: |
          git config --global user.email "ci@veclayer.test"
          git config --global user.name "CI Runner"

      - name: Install protoc (needed by lance-encoding via prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        if: matrix.features == ''
        run: cargo check --all-targets

      - name: Check (sqlite-only)
        if: matrix.features != '' && contains(matrix.features, 'sqlite') && !contains(matrix.features, 'clustering') && !contains(matrix.features, 'server') && !contains(matrix.features, 'all-features')
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Check (lance-only)
        if: matrix.features != '' && contains(matrix.features, 'lance')
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Check (server bundle)
        if: matrix.features != '' && contains(matrix.features, 'server')
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Check (clustering without llm)
        if: matrix.features != '' && contains(matrix.features, 'clustering')
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Check (all features)
        if: matrix.features == '--all-features'
        run: cargo check --all-targets ${{ matrix.features }}
