[package]
name = "veclayer"
version = "0.1.0"
edition = "2021"
description = "Hierarchical vector memory for AI agents — perspectives, salience, aging, identity"
license = "MIT"
repository = "https://github.com/burka/veclayer"
homepage = "https://github.com/burka/veclayer"
readme = "README.md"
authors = ["Florian Burka"]
keywords = ["vector", "embedding", "memory", "llm", "rag"]
categories = ["database", "command-line-utilities"]
exclude = [".claude/", ".mcp.json", "opencode.json"]
rust-version = "1.93"

[features]
default = ["full"]
store-lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
store-sqlite = ["dep:rusqlite"]
parser = ["dep:pulldown-cmark"]
config = ["dep:toml", "dep:glob", "dep:directories", "dep:shellexpand", "dep:regex", "dep:serde_yml", "dep:walkdir"]
cli = ["store-lance", "mcp", "config", "parser", "dep:clap", "dep:owo-colors", "dep:tracing-subscriber"]
mcp = ["config", "dep:rmcp", "dep:schemars"]
embedding-local = ["config", "dep:fastembed"]
llm = ["dep:reqwest", "dep:linfa", "dep:linfa-clustering", "dep:ndarray"]
http = ["auth", "mcp", "dep:axum", "dep:tower", "dep:tower-http", "rmcp/transport-streamable-http-server"]
auth = ["dep:ed25519-dalek", "dep:jsonwebtoken", "dep:aes-gcm", "dep:argon2", "dep:rpassword", "dep:uuid", "dep:zeroize", "dep:bs58", "dep:base64", "dep:percent-encoding", "dep:rand", "dep:rand_core"]
sync = []
full = ["cli", "embedding-local", "store-sqlite", "llm", "http", "auth"]

[dependencies]
# CLI (gated behind "cli" feature)
clap = { version = "4", features = ["derive", "env"], optional = true }

# Vector DB (gated behind "store-lance" feature)
lancedb = { version = "0.21", optional = true }
arrow-array = { version = "55", optional = true }
arrow-schema = { version = "55", optional = true }

# SQLite backend (gated behind "store-sqlite" feature)
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

# Embeddings (gated behind "embedding-local" feature)
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"], optional = true }

# Markdown parsing (gated behind "parser" feature)
pulldown-cmark = { version = "0.13", optional = true }

# MCP Server (rmcp — official Rust MCP SDK, gated behind "mcp" feature)
# transport-io is always available; transport-streamable-http-server requires the "http" feature
rmcp = { version = "1.1", features = ["server", "macros", "transport-io"], optional = true }

# Web server (gated behind "http" feature)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", optional = true }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Content-hash IDs
sha2 = "0.10"
blake3 = "1"

# Cryptographic identity (gated behind "auth" feature)
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"], optional = true }

# Auth — JWT tokens and capability model (gated behind "auth" feature)
jsonwebtoken = { version = "10", features = ["ed25519-dalek", "rust_crypto"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zeroize = { version = "1", optional = true }
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.9", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
rpassword = { version = "7", optional = true }
bs58 = { version = "0.5", optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }

# Binary serialization
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Date/time (needed for rmcp Annotations)
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Utilities
walkdir = { version = "2", optional = true }
strsim = "0.11"
schemars = { version = "1", features = ["chrono04"], optional = true }
fs2 = "0.4"
directories = { version = "6", optional = true }
glob = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
shellexpand = { version = "3", optional = true }

# LLM-dependent (gated behind "llm" feature)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
linfa = { version = "0.7", optional = true }
linfa-clustering = { version = "0.7", optional = true }
ndarray = { version = "0.15", optional = true }
owo-colors = { version = "4.2.3", features = ["supports-colors"], optional = true }
serde_yml = { version = "0.0.12", optional = true }

[[bin]]
name = "veclayer"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0
lto = "thin"
